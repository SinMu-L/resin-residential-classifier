services:
  node-enricher:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Resin 数据源目录：只读挂载，从文件系统层面杜绝误写（AC-1）
      - ./resin-data/cache:/data/source:ro
      # 应用 SQLite：读写持久化
      - ./app-data:/data/app
      # 离线库 Merged-IP.mmdb：可写持久化（由 entrypoint 下载/更新）
      - ./mmdb-data:/data/mmdb
    env_file: .env
    environment:
      # 以 .env 为准；未设置时回退到容器内挂载点默认值
      SOURCE_DB_PATH: ${SOURCE_DB_PATH:-/data/source/cache.db}
      APP_DB_PATH: ${APP_DB_PATH:-/data/app/nodes.sqlite}
      # 离线库路径指向可写卷；启用 mergedip 时在 .env 打开 MERGED_IP_AUTO_DOWNLOAD=true
      MERGED_IP_DB_PATH: ${MERGED_IP_DB_PATH:-/data/mmdb/Merged-IP.mmdb}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
